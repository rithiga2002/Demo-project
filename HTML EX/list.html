<!DOCTYPE html>
<html>
    <head>
        <title>Html list</title>
    </head>
    <body>
        <h2>Unordered List</h2>
        <ul>
            <li>Apple</li>
            <li>Mango</li>
            <li>Orange</li>
        </ul>
        <h2>Ordered List</h2>
        <ol>
            <li>Pink</li>
            <li>Red</li>
            <li>Blue</li>
        </ol>
    </body>
</html>
